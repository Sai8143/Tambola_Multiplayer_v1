name: fate_tickets

description: Fate Tickets Hidden Influence

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # =========================
  # FIREBASE
  # =========================

  firebase_core: ^3.6.0

  cloud_firestore: ^5.4.4

  # =========================
  # UTILITIES
  # =========================

  uuid: ^4.5.1

  # =========================
  # UI
  # =========================

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # =========================
  # ASSETS
  # =========================

  assets:
    - assets/audio/

  # =========================
  # FONTS
  # =========================

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700